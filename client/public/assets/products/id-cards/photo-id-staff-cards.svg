<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Full-Color Laminated Photo Staff ID Cards">
  <defs>
    <radialGradient id="bgGradStaff" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cardGradStaff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="headerGradStaff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A82F19"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadowStaff" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGradStaff)"/>

  <!-- Top Woven Lanyard Graphic Attaching to Card Slot -->
  <g transform="translate(600, 30)">
    <!-- Woven Lanyard Ribbon -->
    <path d="M -30 -30 L -18 105 L 18 105 L 30 -30 Z" fill="#A82F19"/>
    <text x="0" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="3">ONPRINT</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="3">DUBAI</text>

    <!-- Metal Swivel Clip & Ring -->
    <circle cx="0" cy="112" r="14" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <rect x="-6" y="122" width="12" height="24" rx="3" fill="#cbd5e1"/>
    <path d="M -10 144 L 10 144 L 0 162 Z" fill="#94a3b8"/>
  </g>

  <!-- Main Card Body -->
  <g transform="translate(340, 180)" filter="url(#shadowStaff)">
    <rect width="520" height="570" rx="26" fill="url(#cardGradStaff)"/>
    <rect width="520" height="570" rx="26" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Lanyard Oval Punch Slot -->
    <g transform="translate(260, 20)">
      <rect x="-24" y="0" width="48" height="14" rx="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Top Corporate Branding Header -->
    <g transform="translate(0, 50)">
      <rect width="520" height="65" fill="url(#headerGradStaff)"/>
      <text x="40" y="42" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2">GLOBAL LOGISTICS DXB</text>
      <text x="480" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end" opacity="0.9">STAFF PASS</text>
    </g>

    <!-- High-Resolution Full-Color Portrait Area -->
    <g transform="translate(50, 145)">
      <!-- Gradient Frame -->
      <rect width="170" height="215" rx="14" fill="#f1f5f9" stroke="#A82F19" stroke-width="3"/>
      <!-- Portrait Illustration -->
      <rect x="6" y="6" width="158" height="203" rx="10" fill="#cbd5e1"/>
      <circle cx="85" cy="75" r="42" fill="#475569"/>
      <path d="M 22 195 C 22 140 50 130 85 130 C 120 130 148 140 148 195 Z" fill="#1e293b"/>
      <!-- 600 DPI Retransfer Tag Badge -->
      <rect x="15" y="172" width="140" height="24" rx="4" fill="#A82F19"/>
      <text x="85" y="188" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">600 DPI RETRANSFER</text>
    </g>

    <!-- Employee Credentials Block -->
    <g transform="translate(250, 155)">
      <text x="0" y="26" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900">Rania Mansouri</text>
      <text x="0" y="54" fill="#A82F19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">OPERATIONS MANAGER</text>
      
      <line x1="0" y1="75" x2="220" y2="75" stroke="#e2e8f0" stroke-width="2"/>

      <text x="0" y="105" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DEPARTMENT</text>
      <text x="0" y="125" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="800">AIR CARGO TERMINAL 3</text>

      <text x="0" y="155" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAFF NUMBER</text>
      <text x="0" y="175" fill="#0f172a" font-family="'Roboto Mono', monospace" font-size="15" font-weight="800">DXB-77402-OM</text>
    </g>

    <!-- QR Code & Barcode Verification Card Section -->
    <g transform="translate(50, 385)">
      <rect width="420" height="110" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Stylized QR Code -->
      <g transform="translate(20, 15)">
        <rect width="80" height="80" rx="6" fill="#0f172a"/>
        <rect x="8" y="8" width="22" height="22" fill="#ffffff"/>
        <rect x="13" y="13" width="12" height="12" fill="#0f172a"/>
        <rect x="50" y="8" width="22" height="22" fill="#ffffff"/>
        <rect x="55" y="13" width="12" height="12" fill="#0f172a"/>
        <rect x="8" y="50" width="22" height="22" fill="#ffffff"/>
        <rect x="13" y="55" width="12" height="12" fill="#0f172a"/>
        <rect x="36" y="36" width="10" height="10" fill="#ffffff"/>
        <rect x="50" y="50" width="8" height="8" fill="#ffffff"/>
        <rect x="62" y="62" width="10" height="10" fill="#ffffff"/>
      </g>

      <g transform="translate(120, 35)">
        <text x="0" y="16" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900">INSTANT ID VERIFICATION</text>
        <text x="0" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Scan QR for secure biometric verification.</text>
        <text x="0" y="54" fill="#A82F19" font-family="system-ui, sans-serif" font-size="12" font-weight="800">EXPIRY: DEC 2028 • ACTIVE STATUS</text>
      </g>
    </g>

    <!-- Footer -->
    <text x="50" y="535" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="800">HIGH-DENSITY GLOSS LAMINATED PVC • SLOT PUNCHED</text>
    <text x="470" y="535" fill="#A82F19" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="end">ONPRINT UAE</text>
  </g>
</svg>
