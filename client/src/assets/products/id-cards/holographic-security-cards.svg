<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="High-Security Holographic Employee Badges">
  <defs>
    <radialGradient id="bgGradHolo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="cardBgHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadowHolo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGradHolo)"/>
  
  <g transform="translate(340, 150)" filter="url(#shadowHolo)">
    <rect width="520" height="600" rx="26" fill="url(#cardBgHolo)"/>
    <rect width="520" height="600" rx="26" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Top Holographic Foil Band -->
    <path d="M 0 26 C 0 11.64 11.64 0 26 0 L 494 0 C 508.36 0 520 11.64 520 26 L 520 85 L 0 85 Z" fill="#0f172a"/>
    <!-- Iridescent Rainbow Strip -->
    <rect x="0" y="80" width="520" height="6" fill="url(#holoGradient)"/>
    
    <text x="35" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2">FEDERAL SECURITY</text>
    <rect x="360" y="28" width="125" height="32" rx="6" fill="url(#holoGradient)"/>
    <rect x="362" y="30" width="121" height="28" rx="4" fill="#0f172a"/>
    <text x="422.5" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="2">GOVT LEVEL 4</text>

    <!-- Guilloche Security Pattern Background -->
    <g opacity="0.12" stroke="#0f172a" stroke-width="1.2" fill="none">
      <path d="M 30 180 Q 150 120 260 180 T 490 180"/>
      <path d="M 30 200 Q 150 140 260 200 T 490 200"/>
      <path d="M 30 220 Q 150 160 260 220 T 490 220"/>
      <path d="M 30 240 Q 150 180 260 240 T 490 240"/>
      <path d="M 30 260 Q 150 200 260 260 T 490 260"/>
    </g>

    <!-- Portrait Photo with Hologram Overlay Seal -->
    <g transform="translate(50, 125)">
      <rect width="165" height="205" rx="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
      <circle cx="82.5" cy="75" r="42" fill="#64748b"/>
      <path d="M 22 185 C 22 135 50 125 82.5 125 C 115 125 143 135 143 185 Z" fill="#334155"/>
      
      <!-- Hologram Shield Overlay Seal -->
      <g transform="translate(105, 140)">
        <polygon points="30,0 60,10 60,40 30,60 0,40 0,10" fill="url(#holoGradient)" opacity="0.9"/>
        <polygon points="30,6 54,14 54,36 30,52 6,36 6,14" fill="#ffffff" opacity="0.3"/>
        <text x="30" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">VALID</text>
      </g>
    </g>

    <!-- Employee Info -->
    <g transform="translate(245, 135)">
      <text x="0" y="24" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="900">Dr. Sarah Vance</text>
      <text x="0" y="50" fill="#e11d48" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1">CHIEF COMPLIANCE OFFICER</text>
      
      <line x1="0" y1="70" x2="225" y2="70" stroke="#cbd5e1" stroke-width="2"/>

      <text x="0" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BADGE NUMBER</text>
      <text x="0" y="120" fill="#0f172a" font-family="'Roboto Mono', monospace" font-size="15" font-weight="800">SEC-992-HOLO</text>

      <text x="0" y="150" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CLEARANCE</text>
      <text x="0" y="170" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">CLASS 1 DEFENSE</text>
    </g>

    <!-- 3D Holographic Ribbon Overlay across Card -->
    <g transform="translate(50, 360)">
      <rect width="420" height="70" rx="10" fill="url(#holoGradient)" opacity="0.85"/>
      <rect x="3" y="3" width="414" height="64" rx="8" fill="#ffffff" opacity="0.15"/>
      <!-- Guilloche security rosette within foil -->
      <circle cx="50" cy="35" r="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <polygon points="50,15 65,35 50,55 35,35" fill="#ffffff" opacity="0.5"/>
      <text x="90" y="32" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="3">GENUINE SECURE BADGE</text>
      <text x="90" y="52" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1">OPTICAL VARIABLE DEVICE • UV INK VERIFIED</text>
    </g>

    <!-- Bottom Barcode & Security Number -->
    <g transform="translate(50, 455)">
      <rect width="420" height="75" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="44" fill="#0f172a" font-family="'Roboto Mono', monospace" font-size="17" font-weight="800" letter-spacing="4">★ 992-883-UAE-HOLO ★</text>
      <rect x="290" y="16" width="110" height="42" rx="6" fill="#0f172a"/>
      <text x="345" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">ANTI-FORGERY</text>
    </g>

    <!-- Footer -->
    <text x="50" y="565" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="800">30mil COMPOSITE PVC • 3D OPTICAL HOLOGRAM</text>
    <text x="470" y="565" fill="#A82F19" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="end">ONPRINT UAE</text>
  </g>
</svg>
