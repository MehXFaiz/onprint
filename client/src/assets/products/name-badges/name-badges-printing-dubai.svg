<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Name Badges and Architectural Signage Printing Dubai">
  <defs>
    <!-- Background Studio Surface: Luxury Midnight Navy Leather Desk with Warm Vignette -->
    <radialGradient id="bgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#162542"/>
      <stop offset="50%" stop-color="#101D35"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </radialGradient>

    <!-- Warm Gold Ambient Spotlight -->
    <radialGradient id="goldSpotlight" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF65" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#D4AF65" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D4AF65" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushed Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CA7C"/>
      <stop offset="25%" stop-color="#FFF6DB"/>
      <stop offset="50%" stop-color="#D4AF65"/>
      <stop offset="75%" stop-color="#F3DFC2"/>
      <stop offset="100%" stop-color="#A67C2E"/>
    </linearGradient>

    <!-- Deep Polished Brass Gradient -->
    <linearGradient id="polishedBrass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C89B3C"/>
      <stop offset="20%" stop-color="#FDEEA2"/>
      <stop offset="45%" stop-color="#BA8927"/>
      <stop offset="70%" stop-color="#F5E397"/>
      <stop offset="90%" stop-color="#A2751E"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>

    <!-- Acrylic Glass Specular Gradient -->
    <linearGradient id="acrylicSpecular" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#D4AF65" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Standoff Chrome Hardware -->
    <radialGradient id="chromeBolt" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Soft Contact Shadows -->
    <filter id="contactShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgRadial)"/>
  <rect width="1200" height="800" fill="url(#goldSpotlight)"/>

  <!-- Subtle Executive Grid Texture in Background -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Collection Brand Header Banner (Luxury Minimalist) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-180" y="-22" width="360" height="34" rx="17" fill="#101D35" stroke="#D4AF65" stroke-width="1" opacity="0.9"/>
    <circle cx="-150" cy="-5" r="4" fill="#D4AF65"/>
    <text x="0" y="0" fill="#D4AF65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="3.5">DUBAI LUXURY COLLECTION</text>
    <circle cx="150" cy="-5" r="4" fill="#D4AF65"/>
    <text x="0" y="42" fill="#FFFFFF" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="24" font-weight="bold" letter-spacing="1.5">EXECUTIVE NAME BADGES &amp; ARCHITECTURAL PLAQUES</text>
  </g>

  <!-- ITEM 1 (Back Left): ARCHITECTURAL WALL PLAQUE WITH STANDOFFS -->
  <g transform="translate(90, 160)" filter="url(#contactShadow)">
    <rect x="0" y="0" width="460" height="270" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="16" y="16" width="428" height="238" rx="6" fill="url(#polishedBrass)"/>
    <rect x="22" y="22" width="416" height="226" rx="4" fill="none" stroke="#785311" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
    
    <g transform="translate(230, 75)">
      <circle cx="0" cy="0" r="24" fill="#1E293B" stroke="#785311" stroke-width="1.5"/>
      <polygon points="0,-14 12,0 0,14 -12,0" fill="none" stroke="#D4AF65" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#D4AF65"/>
    </g>
    <text x="230" y="132" fill="#0F172A" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" letter-spacing="4" text-anchor="middle">EXECUTIVE BOARDROOM</text>
    <line x1="130" y1="145" x2="330" y2="145" stroke="#785311" stroke-width="1.5"/>
    <text x="230" y="168" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="4.5" text-anchor="middle">SUITE 402 • PRIVATE CLIENT SERVICES</text>
    <text x="230" y="194" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">DUBAI INTERNATIONAL FINANCIAL CENTRE</text>
    <rect x="170" y="212" width="120" height="20" rx="10" fill="#1E293B"/>
    <text x="230" y="226" fill="#D4AF65" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="2" text-anchor="middle">PRECISION ENGRAVED</text>

    <!-- 4 Polished Chrome Standoff Bolts -->
    <g transform="translate(28, 28)"><circle cx="0" cy="0" r="9" fill="url(#chromeBolt)"/><circle cx="0" cy="0" r="3.5" fill="#334155"/></g>
    <g transform="translate(432, 28)"><circle cx="0" cy="0" r="9" fill="url(#chromeBolt)"/><circle cx="0" cy="0" r="3.5" fill="#334155"/></g>
    <g transform="translate(28, 242)"><circle cx="0" cy="0" r="9" fill="url(#chromeBolt)"/><circle cx="0" cy="0" r="3.5" fill="#334155"/></g>
    <g transform="translate(432, 242)"><circle cx="0" cy="0" r="9" fill="url(#chromeBolt)"/><circle cx="0" cy="0" r="3.5" fill="#334155"/></g>
  </g>

  <!-- ITEM 2 (Upper Right): PROFESSIONAL BRUSHED CHAMPAGNE GOLD MAGNETIC BADGE -->
  <g transform="translate(640, 175)" filter="url(#contactShadow)">
    <rect x="0" y="0" width="460" height="170" rx="14" fill="url(#champagneGold)" stroke="#B89245" stroke-width="1.5"/>
    <path d="M 14 2 L 446 2 A 12 12 0 0 1 458 14 L 458 40 L 14 2 Z" fill="#FFFFFF" opacity="0.4"/>
    <rect x="10" y="10" width="440" height="150" rx="10" fill="none" stroke="#946E24" stroke-width="1" opacity="0.35"/>
    
    <g transform="translate(65, 85)">
      <rect x="-38" y="-38" width="76" height="76" rx="12" fill="#101D35" stroke="#D4AF65" stroke-width="1.5"/>
      <polygon points="0,-22 18,-4 12,18 -12,18 -18,-4" fill="url(#champagneGold)"/>
      <circle cx="0" cy="0" r="6" fill="#101D35"/>
      <text x="0" y="2" fill="#D4AF65" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="bold" text-anchor="middle">OP</text>
    </g>

    <g transform="translate(135, 55)">
      <text x="0" y="0" fill="#101D35" font-family="'Cinzel', Georgia, serif" font-size="21" font-weight="bold" letter-spacing="1.5">ALEXANDER WRIGHT</text>
      <text x="0" y="24" fill="#7A5814" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="3.5">MANAGING DIRECTOR</text>
      <line x1="0" y1="35" x2="290" y2="35" stroke="#B89245" stroke-width="1.5" opacity="0.7"/>
      <text x="0" y="54" fill="#243046" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">PRIVATE CLIENT GROUP • DUBAI</text>
    </g>

    <!-- Attached Triple Neodymium Magnetic Backing -->
    <g transform="translate(300, 122)">
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="24" cy="18" r="9" fill="url(#chromeBolt)"/><circle cx="24" cy="18" r="3" fill="#0284C7"/>
      <circle cx="70" cy="18" r="9" fill="url(#chromeBolt)"/><circle cx="70" cy="18" r="3" fill="#0284C7"/>
      <circle cx="116" cy="18" r="9" fill="url(#chromeBolt)"/><circle cx="116" cy="18" r="3" fill="#0284C7"/>
      <text x="70" y="-6" fill="#101D35" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.5" text-anchor="middle">TRIPLE NEODYMIUM MAGNET</text>
    </g>
  </g>

  <!-- ITEM 3 (Center Bottom Foreground): 20MM BEVELED ACRYLIC DESK NAMEPLATE -->
  <g transform="translate(310, 480)" filter="url(#contactShadow)">
    <polygon points="20,180 560,180 580,210 0,210" fill="#05080E" opacity="0.6"/>
    <rect x="10" y="10" width="560" height="150" rx="8" fill="#101D35" opacity="0.7" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="580" height="170" rx="10" fill="url(#acrylicSpecular)" stroke="#94A3B8" stroke-width="1.5"/>
    
    <polyline points="0,170 12,158 568,158 580,170" fill="#FFFFFF" opacity="0.35"/>
    <polyline points="0,0 12,12 568,12 580,0" fill="#FFFFFF" opacity="0.7"/>
    <polyline points="0,0 12,12 12,158 0,170" fill="#E2E8F0" opacity="0.4"/>
    <polyline points="580,0 568,12 568,158 580,170" fill="#CBD5E1" opacity="0.4"/>

    <g transform="translate(290, 68)" text-anchor="middle">
      <text x="0" y="0" fill="#F8FAFC" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" letter-spacing="3">HIS EXCELLENCY TARIQ AL-HASHIMI</text>
      <text x="0" y="26" fill="#D4AF65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="4">SENIOR EXECUTIVE VICE PRESIDENT</text>
      <line x1="-160" y1="38" x2="160" y2="38" stroke="#D4AF65" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="0" y="58" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3">EMIRATES GLOBAL ENTERPRISES • DUBAI HEADQUARTERS</text>
    </g>

    <g transform="translate(35, 155)"><rect x="0" y="0" width="50" height="16" rx="4" fill="url(#chromeBolt)"/><rect x="4" y="14" width="42" height="2" fill="#1E293B"/></g>
    <g transform="translate(495, 155)"><rect x="0" y="0" width="50" height="16" rx="4" fill="url(#chromeBolt)"/><rect x="4" y="14" width="42" height="2" fill="#1E293B"/></g>
  </g>

  <!-- ITEM 4 (Bottom Left Foreground): 3D CRYSTAL DOMED EPOXY RESIN BADGE -->
  <g transform="translate(70, 485)" filter="url(#contactShadow)">
    <rect x="0" y="0" width="210" height="155" rx="16" fill="url(#champagneGold)" stroke="#B89245" stroke-width="1"/>
    <rect x="6" y="6" width="198" height="143" rx="12" fill="#0F172A"/>
    
    <ellipse cx="105" cy="35" rx="80" ry="22" fill="#FFFFFF" opacity="0.35"/>
    <path d="M 16 18 C 60 8, 150 8, 194 18 C 170 38, 40 38, 16 18 Z" fill="#FFFFFF" opacity="0.2"/>
    
    <g transform="translate(105, 75)" text-anchor="middle">
      <polygon points="0,-18 12,-6 8,10 -8,10 -12,-6" fill="#D4AF65"/>
      <text x="0" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">BURJ AL ARAB</text>
      <text x="0" y="38" fill="#D4AF65" font-family="system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="2.5">VIP HOSPITALITY</text>
      <rect x="-40" y="46" width="80" height="12" rx="6" fill="#101D35" stroke="#D4AF65" stroke-width="0.8"/>
      <text x="0" y="55" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.5">3D EPOXY DOME</text>
    </g>
  </g>

  <!-- ITEM 5 (Bottom Right Foreground): EXECUTIVE MATTE BLACK & LASER GOLD BADGE -->
  <g transform="translate(920, 485)" filter="url(#contactShadow)">
    <rect x="0" y="0" width="220" height="155" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
    <rect x="6" y="6" width="208" height="143" rx="10" fill="#09090B"/>
    
    <g transform="translate(110, 50)" text-anchor="middle">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#D4AF65" stroke-width="1.5"/>
      <text x="0" y="4" fill="#D4AF65" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="bold">DXB</text>
      <text x="0" y="32" fill="#FAFAFA" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.5">FARHAN MALIK</text>
      <text x="0" y="48" fill="#D4AF65" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" letter-spacing="2.5">PARTNER &amp; CIO</text>
      <line x1="-50" y1="56" x2="50" y2="56" stroke="#D4AF65" stroke-width="1" opacity="0.6"/>
      <text x="0" y="72" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2">DUBAI SILICON OASIS</text>
    </g>
    <line x1="14" y1="1" x2="206" y2="1" stroke="#71717A" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Bottom Accent Tagline -->
  <g transform="translate(600, 775)" text-anchor="middle">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">ONPRINT DUBAI • UV PRINTING • LASER ETCHING • MAGNETIC FASTENERS • PREMIUM ARCHITECTURAL METALS</text>
  </g>
</svg>