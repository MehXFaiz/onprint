<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="HiCo Magnetic Stripe Corporate ID Cards">
  <defs>
    <radialGradient id="bgGradMag" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cardGradMag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="magStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadowMag" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGradMag)"/>

  <!-- Card Display: Card Back (Featuring prominent HiCo Stripe) -->
  <g transform="translate(340, 150)" filter="url(#shadowMag)">
    <rect width="520" height="600" rx="26" fill="url(#cardGradMag)"/>
    <rect width="520" height="600" rx="26" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- High Coercivity (HiCo) 2750 Oe Magnetic Stripe (Upper section of back) -->
    <rect x="0" y="65" width="520" height="110" fill="url(#magStripe)"/>
    <line x1="0" y1="65" x2="520" y2="65" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="0" y1="175" x2="520" y2="175" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="490" y="125" fill="#a1a1aa" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" text-anchor="end" letter-spacing="3">HiCo 2750 Oe • 3-TRACK MAGNETIC STRIPE</text>

    <!-- Signature Panel Area -->
    <g transform="translate(45, 215)">
      <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AUTHORIZED SIGNATURE • NOT TRANSFERABLE</text>
      <rect x="0" y="10" width="310" height="65" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- Script Signature Rendering -->
      <path d="M 25 50 Q 60 25 100 45 T 180 35 T 260 55" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- CVC / Security Code Box -->
      <rect x="330" y="10" width="100" height="65" rx="6" fill="#0f172a"/>
      <text x="380" y="48" fill="#ffffff" font-family="'Roboto Mono', monospace" font-size="20" font-weight="900" text-anchor="middle">894</text>
      <text x="380" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SECURITY CODE</text>
    </g>

    <!-- Terms & Corporate Information -->
    <g transform="translate(45, 330)">
      <rect width="430" height="105" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="20" y="28" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="800">PROPERTY OF ISSUING ORGANIZATION</text>
      <text x="20" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500">This credential card remains the property of ONPRINT UAE.</text>
      <text x="20" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500">Use of this card is governed by corporate security policies.</text>
      <text x="20" y="86" fill="#A82F19" font-family="system-ui, sans-serif" font-size="11" font-weight="800">If found, please return to Dubai HQ Security Office.</text>
    </g>

    <!-- Bottom Scannable Barcode -->
    <g transform="translate(45, 465)">
      <rect width="430" height="70" rx="8" fill="#0f172a"/>
      <g transform="translate(30, 15)">
        <!-- Barcode Lines -->
        <rect x="0" y="0" width="3" height="40" fill="#ffffff"/>
        <rect x="6" y="0" width="5" height="40" fill="#ffffff"/>
        <rect x="15" y="0" width="2" height="40" fill="#ffffff"/>
        <rect x="20" y="0" width="7" height="40" fill="#ffffff"/>
        <rect x="30" y="0" width="4" height="40" fill="#ffffff"/>
        <rect x="38" y="0" width="2" height="40" fill="#ffffff"/>
        <rect x="44" y="0" width="6" height="40" fill="#ffffff"/>
        <rect x="54" y="0" width="4" height="40" fill="#ffffff"/>
        <rect x="62" y="0" width="3" height="40" fill="#ffffff"/>
        <rect x="69" y="0" width="8" height="40" fill="#ffffff"/>
        <rect x="80" y="0" width="3" height="40" fill="#ffffff"/>
        <rect x="86" y="0" width="5" height="40" fill="#ffffff"/>
        <rect x="95" y="0" width="2" height="40" fill="#ffffff"/>
        <rect x="100" y="0" width="7" height="40" fill="#ffffff"/>
        <rect x="111" y="0" width="4" height="40" fill="#ffffff"/>
        <rect x="118" y="0" width="5" height="40" fill="#ffffff"/>
        <rect x="127" y="0" width="3" height="40" fill="#ffffff"/>
        <rect x="133" y="0" width="6" height="40" fill="#ffffff"/>
        <rect x="143" y="0" width="4" height="40" fill="#ffffff"/>
        <rect x="151" y="0" width="8" height="40" fill="#ffffff"/>
        <rect x="163" y="0" width="3" height="40" fill="#ffffff"/>
        <rect x="170" y="0" width="5" height="40" fill="#ffffff"/>
        <rect x="180" y="0" width="4" height="40" fill="#ffffff"/>
      </g>
      <text x="310" y="42" fill="#ffffff" font-family="'Roboto Mono', monospace" font-size="14" font-weight="800">DXB-MAG-2750</text>
    </g>

    <!-- Footer -->
    <text x="45" y="568" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="800">CR80 0.76mm PVC • 3-TRACK ISO 7811 SWIPE ENCODING</text>
    <text x="475" y="568" fill="#A82F19" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="end">ONPRINT UAE</text>
  </g>
</svg>
