<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Visitor Pass Cards & Clear Badge Holders">
  <defs>
    <radialGradient id="bgGradVis" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="visHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A82F19"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="acrylicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadowHolder" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGradVis)"/>

  <!-- Metal Clip / Fastener at top -->
  <g transform="translate(600, 45)">
    <!-- Crocodile Clip / Strap -->
    <rect x="-14" y="0" width="28" height="55" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="0" cy="25" r="7" fill="#cbd5e1"/>
    <!-- Metal Clip Jaws -->
    <polygon points="-20,55 20,55 12,75 -12,75" fill="#64748b"/>
    <circle cx="0" cy="65" r="4" fill="#0f172a"/>
  </g>

  <!-- Clear Acrylic Rigid Badge Holder -->
  <g transform="translate(315, 115)" filter="url(#shadowHolder)">
    <!-- Acrylic Outer Frame -->
    <rect width="570" height="690" rx="30" fill="url(#acrylicGrad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7"/>
    
    <!-- Top Acrylic Tab with Hole Slot -->
    <g transform="translate(285, 20)">
      <rect x="-30" y="0" width="60" height="16" rx="8" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Inner Card Sealed inside Holder -->
    <g transform="translate(25, 55)">
      <rect width="520" height="600" rx="20" fill="#ffffff"/>
      
      <!-- Top Bold Crimson Header -->
      <path d="M 0 20 C 0 8.95 8.95 0 20 0 L 500 0 C 511.05 0 520 8.95 520 20 L 520 145 L 0 145 Z" fill="url(#visHeader)"/>
      
      <text x="260" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="4">VISITOR PASS</text>
      <text x="260" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle" opacity="0.9" letter-spacing="2">DUBAI CORPORATE TOWERS</text>

      <!-- Yellow High-Visibility Badge Number -->
      <g transform="translate(195, 105)">
        <rect width="130" height="52" rx="10" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
        <text x="65" y="36" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">PASS 01</text>
      </g>

      <!-- Middle Escort & Instructions Body -->
      <g transform="translate(45, 185)">
        <rect width="430" height="155" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
        
        <g transform="translate(25, 25)">
          <circle cx="16" cy="16" r="16" fill="#A82F19"/>
          <text x="16" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">!</text>
          <text x="45" y="22" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900">MUST BE WORN AT ALL TIMES</text>
        </g>

        <text x="25" y="75" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">• Valid for date of issue only.</text>
        <text x="25" y="98" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">• Escort required in all restricted production &amp; data zones.</text>
        <text x="25" y="121" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">• Return this badge to reception upon departure.</text>
      </g>

      <!-- Zone Clearance Band -->
      <g transform="translate(45, 360)">
        <rect width="430" height="85" rx="12" fill="#0f172a"/>
        <text x="25" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AUTHORIZED BUILDING ZONES</text>
        <text x="25" y="60" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900">LOBBY • 12TH FLOOR • BOARDROOMS</text>
      </g>

      <!-- Reusable Dry-Erase Host Line -->
      <g transform="translate(45, 465)">
        <rect width="430" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="20" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HOST NAME / CONTACT: ___________________________</text>
      </g>

      <!-- Footer -->
      <text x="45" y="565" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="800">HEAVY-DUTY REUSABLE PVC • CLEAR ACRYLIC CASE</text>
      <text x="475" y="565" fill="#A82F19" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="end">ONPRINT UAE</text>
    </g>

    <!-- Acrylic Gloss Sheen Highlight Reflection -->
    <path d="M 30 60 L 220 60 L 80 660 L 30 660 Z" fill="#ffffff" opacity="0.08"/>
  </g>
</svg>
